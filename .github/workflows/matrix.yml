name: matrix

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"

jobs:
  run:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24]
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: abortlab
          POSTGRES_PASSWORD: abortlab
          POSTGRES_DB: abortlab
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U abortlab -d abortlab"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mysql:
        image: mysql:8.4.13
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: abortlab
          MYSQL_USER: abortlab
          MYSQL_PASSWORD: abortlab
        ports:
          - 53306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm test
      - name: Single-query matrix
        run: npm start
      - name: Pool starvation test
        if: always()
        run: npm run starvation
      - name: Publish both tables to the job summary
        if: always()
        run: |
          for f in results/matrix.md results/starvation.md; do
            if [ -f "$f" ]; then cat "$f" >> "$GITHUB_STEP_SUMMARY"; echo >> "$GITHUB_STEP_SUMMARY"; fi
          done
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-node-${{ matrix.node }}
          path: results/
