services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: abortlab
      POSTGRES_PASSWORD: abortlab
      POSTGRES_DB: abortlab
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abortlab -d abortlab"]
      interval: 3s
      timeout: 3s
      retries: 20

  mysql:
    image: mysql:8.4.13
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: abortlab
      MYSQL_USER: abortlab
      MYSQL_PASSWORD: abortlab
    ports:
      - "127.0.0.1:53306:3306"
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 3s
      timeout: 3s
      retries: 40
